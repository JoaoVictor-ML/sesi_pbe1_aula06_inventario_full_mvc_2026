<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <header><h1>Inventário</h1></header>
    <main>
        <section>
            <form action="http://localhost:3000/bens" method="post">
                <h2>Item</h2>
                <input type="text" name="item" placeholder="Nome do item" required>
                <h2>Local do Item</h2>
                <input type="text" name="local" placeholder="Local do item" required>
                <h2>Data do Cadastro</h2>
                <input type="date" name="data" required>
                <h2>Valor</h2>
                <input type="number" step="0.01" name="valor" placeholder="00" required>
                <h2>Número do Patrimônio</h2>
                <input type="text" name="patrimonio" placeholder="Nº do patrimônio" required>
                <input type="submit" value="Enviar">
            </form>
        </section>
        <section>
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Local</th>
                        <th>Data</th>
                        <th>Valor</th>
                        <th>Patrimônio</th>
                    </tr>
                </thead>
                <tbody id="tabela">
                    <script>
                        fetch("http://localhost:3000/bens")
                        .then(resp=>resp.json())
                        .then(resp=>{
                            resp.forEach(p=>{
                                const linha = document.createElement("tr")
                                linha.innerHTML = `
                                <td>${p.item}</td>
                                <td>${p.local}</td>
                                <td>${p.data}</td>
                                <td>${p.valor}</td>
                                <td>${p.patrimonio}</td>
                                `
                                tabela.appendChild(linha)
                            })
                        })
                    </script>
                </tbody>
            </table>
        </section>
    </main>
    <footer>By João Victor</footer>
</body>

</html>
